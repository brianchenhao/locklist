name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          } > local.properties
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Write latest.json
        run: |
          python3 - <<'PY'
          import re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          code = re.search(r"versionCode\s*=\s*(\d+)", text).group(1)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          open("latest.json", "w", encoding="utf-8").write(
              '{"versionCode":%s,"versionName":"%s"}' % (code, name)
          )
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            latest.json
