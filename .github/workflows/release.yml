name: Release

on:
  push:
    tags:
      - "v*"

env:
  # SHA-256 of the signing certificate already installed on the phone. A build signed with
  # anything else could never be installed as an update, so fail loudly instead.
  EXPECTED_SIGNER_SHA256: 2a615ee235b25e22a6f00344cedb20cc9d89f4f2ebb70e6b43ebcb8eff2f06ba

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Restore signing key
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/locklist.keystore"
          test -s "$RUNNER_TEMP/locklist.keystore" || { echo "keystore secret is empty"; exit 1; }
          echo "LOCKLIST_KEYSTORE=$RUNNER_TEMP/locklist.keystore" >> "$GITHUB_ENV"
      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          } > local.properties
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify signer matches the phone
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/.*SHA-256 digest: //p' | head -n 1)
          echo "signer: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "APK signer does not match the key installed on the phone"; exit 1
          fi
      - name: Write latest.json
        run: |
          python3 - <<'PY'
          import re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          code = re.search(r"versionCode\s*=\s*(\d+)", text).group(1)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          open("latest.json", "w", encoding="utf-8").write(
              '{"versionCode":%s,"versionName":"%s"}' % (code, name)
          )
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            latest.json
